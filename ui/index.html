<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Jiyda</title>
<!--
  Интерфейс Jiyda. Этот WebView прозрачный и лежит поверх страниц; окно обрезает его
  регионом (src/frame.rs), поэтому мышь он получает только там, где что-то рисует.
  Ядро отдаёт этот файл, стили (ui/styles.css) и модули (ui/js/*.js) по адресу
  jiyda://ui/… (src/app/ui_assets.rs). Протокол с ядром — src/ipc.rs и ui/js/core.js.
-->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Верхняя панель: Space, назад/вперёд, адрес, Ask Jiyda, закладки, меню. Кнопки окна справа рисует само окно. -->
<header id="chrome" class="chrome" role="toolbar" aria-label="Browser">
  <div class="chrome-left">
    <button id="space-btn" class="space-btn no-drag" aria-haspopup="menu" aria-expanded="false">
      <span class="space-dot" aria-hidden="true"></span>
      <span class="space-name"></span>
      <svg class="i i12 chev" aria-hidden="true"><use href="#i-chevron-down"/></svg>
    </button>
    <button id="back" class="icon-btn no-drag secondary" data-cmd="back"><svg class="i"><use href="#i-arrow-left"/></svg></button>
    <button id="forward" class="icon-btn no-drag secondary" data-cmd="forward"><svg class="i"><use href="#i-arrow-right"/></svg></button>
  </div>

  <div id="address" class="address no-drag">
    <button id="privacy" class="privacy" aria-haspopup="dialog">
      <svg class="i i16"><use href="#i-shield"/></svg><span class="privacy-dot" aria-hidden="true"></span>
    </button>
    <div id="addr-view" class="addr-view" role="button" tabindex="-1">
      <span class="addr-host"></span><span class="addr-path"></span>
    </div>
    <input id="addr-input" class="addr-input" spellcheck="false" autocomplete="off" hidden>
    <button id="addr-star" class="addr-act addr-star" hidden><svg class="i i16"><use href="#i-star"/></svg></button>
    <button id="addr-reload" class="addr-act"><svg class="i i16"><use href="#i-rotate-cw"/></svg></button>
    <kbd id="addr-hint" class="addr-hint">Ctrl K</kbd>
    <div class="addr-progress" aria-hidden="true"></div>
  </div>

  <div class="chrome-right">
    <button id="ask-btn" class="icon-btn no-drag secondary ai-btn"><svg class="i"><use href="#i-sparkle"/></svg></button>
    <button id="bm-btn" class="icon-btn no-drag secondary bm-btn" aria-haspopup="dialog" aria-expanded="false"><svg class="i"><use href="#i-bookmark"/></svg></button>
    <button id="menu-btn" class="icon-btn no-drag secondary" aria-haspopup="menu"><svg class="i"><use href="#i-more"/></svg></button>
    <div class="caption-space" aria-hidden="true"></div>
  </div>
</header>

<!-- Область страницы. Видна, когда страницы нет (New Page) или поверх неё открыт слой. -->
<main id="stage" class="stage">
  <section id="home" class="home" hidden></section>
  <div id="panes" class="panes" hidden></div>
</main>

<!-- Edge Reveal: полоска у левого края и панель навигации. -->
<div id="edge-strip" class="edge-strip" aria-hidden="true"></div>
<nav id="edge" class="edge" aria-label="Navigation" hidden></nav>

<!-- Слои и всплывающие панели. Каждый компонент наполняет свой контейнер сам. -->
<div id="layers"></div>
<div id="popovers"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
