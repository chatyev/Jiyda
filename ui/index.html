<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Seyro</title>
<style>
/* ===== Тема: светлая по умолчанию, тёмная — по системе или выбору (data-theme) ===== */
:root {
  --bg: #eeeef3;            /* фон окна вокруг страницы */
  --sidebar: transparent;
  --text: #1d1d24;
  --text-dim: #6c6c78;
  --text-faint: #9a9aa6;
  --hover: rgba(20, 20, 40, .05);
  --active: rgba(255, 255, 255, .92);
  --active-shadow: 0 1px 2px rgba(20, 20, 40, .08), 0 0 0 1px rgba(20, 20, 40, .04);
  --line: rgba(20, 20, 40, .08);
  --accent: #6c5cf5;
  --accent-soft: rgba(108, 92, 245, .12);
  --panel: rgba(255, 255, 255, .97);
  --panel-shadow: 0 18px 50px rgba(20, 20, 50, .18), 0 0 0 1px rgba(20, 20, 40, .06);
  --page: #ffffff;          /* подложка под страницей */
  --danger: #e5484d;
  --radius: 10px;
  --sw: 260px;   /* ширина сайдбара — задаётся из config.json */
  --pad: 8px;    /* рамка вокруг страницы */
  --find-h: 40px; /* высота панели поиска — та же, что FIND_BAR_H в app.rs */
  --space: #6c5cf5; /* цвет текущего пространства — даёт сайдбару лёгкий оттенок */
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #17171c;
  --text: #ececf2;
  --text-dim: rgba(236, 236, 242, .62);
  --text-faint: rgba(236, 236, 242, .38);
  --hover: rgba(255, 255, 255, .06);
  --active: rgba(255, 255, 255, .11);
  --active-shadow: 0 0 0 1px rgba(255, 255, 255, .04);
  --line: rgba(255, 255, 255, .08);
  --accent: #8e80ff;
  --accent-soft: rgba(142, 128, 255, .18);
  --panel: rgba(34, 34, 42, .98);
  --panel-shadow: 0 18px 50px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .06);
  --page: #1f1f26;
  --danger: #ff6b6f;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden; user-select: none;
  font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: color-mix(in srgb, var(--space) 6%, var(--bg));
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ===== Сайдбар ===== */
#sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--sw);
  display: flex; flex-direction: column; padding: 10px 8px 8px 10px; gap: 4px;
}
body.no-sidebar #sidebar { display: none; }

/* Верхняя строка: знак и название, действия, кнопки окна. За пустое место окно тянется. */
.toolbar { display: flex; align-items: center; gap: 2px; height: 32px; }
.toolbar .spacer { flex: 1; align-self: stretch; }
.brand { display: flex; align-items: center; gap: 8px; padding-left: 4px; font-weight: 650; font-size: 14px; letter-spacing: .01em; }
.brand img { width: 22px; height: 22px; display: block; }
.brand img:not([src]) { display: none; }
.icon-btn {
  width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center;
  color: var(--text-dim); font-size: 15px; flex: none;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ----- Окно без рамки ----- */
.winctl { display: none; gap: 0; margin-left: 2px; }
body.frameless .winctl { display: flex; }
.icon-btn.close:hover { background: #c42b1c; color: #fff; }
#win-max .ico-restore, body.maximized #win-max .ico-max { display: none; }
body.maximized #win-max .ico-restore { display: block; }
/* Края для изменения размера: поверх всего, кроме развёрнутого окна. */
#resize { display: none; }
body.frameless:not(.maximized) #resize { display: block; }
#resize div { position: fixed; z-index: 100; --t: 5px; }
#resize [data-dir="n"] { top: 0; left: var(--t); right: var(--t); height: var(--t); cursor: n-resize; }
#resize [data-dir="s"] { bottom: 0; left: var(--t); right: var(--t); height: var(--t); cursor: s-resize; }
#resize [data-dir="e"] { right: 0; top: var(--t); bottom: var(--t); width: var(--t); cursor: e-resize; }
#resize [data-dir="w"] { left: 0; top: var(--t); bottom: var(--t); width: var(--t); cursor: w-resize; }
#resize [data-dir="nw"] { top: 0; left: 0; width: 10px; height: 10px; cursor: nw-resize; }
#resize [data-dir="ne"] { top: 0; right: 0; width: 10px; height: 10px; cursor: ne-resize; }
#resize [data-dir="sw"] { bottom: 0; left: 0; width: 10px; height: 10px; cursor: sw-resize; }
#resize [data-dir="se"] { bottom: 0; right: 0; width: 10px; height: 10px; cursor: se-resize; }
/* Когда сайдбар скрыт, окно можно тянуть за полоску рамки над страницей. */
#topdrag { display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--pad); z-index: 50; }
body.frameless.no-sidebar #topdrag { display: block; }

/* Строка навигации: назад, вперёд, обновить и адрес текущей вкладки. */
.navrow { display: flex; align-items: center; gap: 2px; margin: 4px 0 6px; }
#urlbar {
  flex: 1; min-width: 0; height: 32px; border-radius: 9px; margin-left: 4px;
  background: var(--active); box-shadow: var(--active-shadow);
  display: flex; align-items: center; padding: 0 10px; gap: 7px; cursor: text;
  color: var(--text-dim); white-space: nowrap; overflow: hidden;
}
#urlbar:hover { color: var(--text); }
#urlbar .host { color: var(--text); overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }

.section-label {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; color: var(--text-faint); padding: 12px 8px 4px; font-weight: 550;
}
.section-label .act { color: var(--text-faint); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; font-weight: 500; }
.section-label .act:hover { background: var(--hover); color: var(--text); }
.section-label .act.plus { font-size: 16px; line-height: 1; padding: 0 5px 2px; }
.list { display: flex; flex-direction: column; gap: 1px; min-height: 4px; }
#scroll { flex: 1; overflow-y: auto; overflow-x: hidden; margin-right: -4px; padding-right: 4px; }
#scroll::-webkit-scrollbar { width: 6px; }
#scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

/* Строки сайдбара: пункты навигации, пространства, вкладки. */
.row, .tab {
  position: relative; height: 32px; border-radius: 8px; padding: 0 6px 0 9px;
  display: flex; align-items: center; gap: 10px; cursor: default; color: var(--text);
}
.row { width: 100%; text-align: left; }
.row:hover, .tab:hover { background: var(--hover); }
.row .ri { width: 18px; height: 18px; display: grid; place-items: center; color: var(--text-dim); flex: none; }
.row .rt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row .kbd { color: var(--text-faint); font-size: 11px; }

.space-row.active { background: var(--accent-soft); }
.space-ico {
  width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center;
  font-size: 10.5px; font-weight: 700; color: #fff; flex: none;
}
.space-row .count { color: var(--text-faint); font-size: 11px; }

.tab.active { background: var(--active); box-shadow: var(--active-shadow); }
.tab.asleep .title { color: var(--text-dim); }
.tab .fav {
  width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center;
  font-size: 10px; font-weight: 700; background: var(--line); color: var(--text-dim); overflow: hidden;
}
.tab .fav img { width: 16px; height: 16px; display: block; }
.tab .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tab .badge { font-size: 11px; color: var(--text-dim); }
.tab .x {
  width: 22px; height: 22px; border-radius: 6px; display: none; place-items: center;
  color: var(--text-dim); font-size: 15px; line-height: 1;
}
.tab:hover .x, .tab.active .x { display: grid; }
.tab .x:hover { background: var(--hover); color: var(--text); }
.tab.loading .fav { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
/* Пара Split View — одна строка с двумя половинами. */
.tab.split { padding: 0 3px; gap: 3px; }
.tab.split.shown { background: var(--hover); }
.tab.split > .tab { flex: 1 1 0; min-width: 0; height: 26px; padding: 0 3px 0 6px; gap: 6px; border-radius: 6px; }
.tab.split > .tab .x { width: 18px; height: 18px; }
.tab.split:hover > .tab:not(:hover):not(.active) .x { display: none; }
.tab.drop-before::before, .tab.drop-after::after {
  content: ""; position: absolute; left: 6px; right: 6px; height: 2px; border-radius: 1px; background: var(--accent);
}
.tab.drop-before::before { top: -1px; }
.tab.drop-after::after { bottom: -1px; }
.list.drop-end { box-shadow: inset 0 -2px 0 var(--accent); }

#nav-home.active { background: var(--active); box-shadow: var(--active-shadow); }
#newtab { color: var(--text-dim); margin-top: 2px; }
#newtab:hover { color: var(--text); }

/* Плашка «доступна новая версия». */
#update {
  display: flex; align-items: center; gap: 6px; padding: 7px 6px 7px 10px; border-radius: 9px;
  background: var(--active); box-shadow: var(--active-shadow); font-size: 12px;
}
#update[hidden] { display: none; }
#update-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#update .update-go { padding: 3px 10px; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; }
#update .update-go:disabled { opacity: .5; cursor: default; }
#update .update-x { width: 20px; height: 20px; border-radius: 5px; color: var(--text-dim); }
#update .update-x:hover { background: var(--hover); color: var(--text); }

#menu .swatches { display: flex; gap: 8px; padding: 7px 10px; }
#menu .swatches button { width: 16px; height: 16px; padding: 0; border-radius: 50%; }
#menu .swatches button.cur { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--text-faint); }

#toast {
  position: fixed; left: 12px; bottom: 14px; max-width: calc(var(--sw) - 24px);
  background: var(--panel); box-shadow: var(--panel-shadow); border-radius: 9px;
  padding: 9px 12px; font-size: 12px; opacity: 0; transform: translateY(6px);
  transition: .18s ease; pointer-events: none; word-break: break-word; z-index: 20;
}
#toast.show { opacity: 1; transform: none; }
body.no-sidebar #toast { left: 50%; transform: translateX(-50%); bottom: 20px; }

/* ===== Область страницы (видна, когда вкладка скрыта) ===== */
#content {
  position: fixed; top: var(--pad); right: var(--pad); bottom: var(--pad); left: var(--sw);
  border-radius: 12px; background: var(--page); box-shadow: 0 1px 3px rgba(20, 20, 40, .08);
  display: grid; place-items: center; text-align: center; color: var(--text-dim);
}
body.no-sidebar #content { left: var(--pad); }
/* ----- Домашняя страница ----- */
body.home #content {
  background:
    radial-gradient(900px 520px at 78% 8%, color-mix(in srgb, var(--space) 34%, transparent), transparent 70%),
    radial-gradient(700px 480px at 12% 92%, color-mix(in srgb, #f59e0b 16%, transparent), transparent 70%),
    linear-gradient(170deg, color-mix(in srgb, var(--space) 10%, var(--page)), var(--page));
}
#home { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 22px 24px 28px; }
#home::-webkit-scrollbar { width: 6px; }
#home::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
/* Поле и блок не сжимаются, когда всё не помещается по высоте, — тогда страница прокручивается. */
.home-search { flex: none; }
.home-main { flex: 1 0 auto; }
.home-search {
  width: min(520px, 100%); height: 44px; border-radius: 13px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px;
  background: color-mix(in srgb, var(--panel) 78%, transparent); box-shadow: var(--panel-shadow); backdrop-filter: blur(14px);
  color: var(--text-faint); text-align: left; cursor: text;
}
.home-search .ph { flex: 1; }
.home-search .hint, #palette .hint { font-size: 11px; color: var(--text-faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.home-main { flex: 1; width: min(640px, 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 0; }
#content .logo { width: 56px; height: 56px; display: block; margin: 0 auto 18px; }
#content .logo:not([src]) { display: none; }
#greet { font-size: 34px; font-weight: 650; color: var(--text); letter-spacing: -.01em; }
.tagline { margin-top: 6px; font-size: 15px; color: var(--text-dim); }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 30px; }
.tiles:empty { display: none; }
.tile {
  width: 84px; height: 84px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: color-mix(in srgb, var(--panel) 80%, transparent); box-shadow: var(--panel-shadow); backdrop-filter: blur(14px);
  color: var(--text); font-size: 11.5px; transition: transform .12s ease;
}
.tile:hover { transform: translateY(-2px); }
.tile .tico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--accent-soft); color: var(--accent); overflow: hidden; }
.tile .tico img { width: 26px; height: 26px; display: block; }
.tile .tname { max-width: 74px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tiles-empty { margin-top: 26px; color: var(--text-faint); font-size: 12.5px; }
.card {
  width: min(460px, 100%); margin-top: 30px; padding: 10px; border-radius: 16px; text-align: left;
  background: color-mix(in srgb, var(--panel) 80%, transparent); box-shadow: var(--panel-shadow); backdrop-filter: blur(14px);
}
.card[hidden] { display: none; }
.card-title { font-size: 12px; color: var(--text-dim); padding: 2px 8px 8px; font-weight: 550; }
.recent-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 10px; text-align: left; }
.recent-row:hover { background: var(--hover); }
.recent-row .rico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--hover); flex: none; overflow: hidden; color: var(--text-dim); font-weight: 700; }
.recent-row .rico img { width: 18px; height: 18px; }
.recent-row .rtext { flex: 1; min-width: 0; }
.recent-row .rtitle { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text); }
.recent-row .rhost { font-size: 11.5px; color: var(--text-faint); }/* Split View: разделитель между страницами и рамка вокруг активной половины.
   Страницы лежат поверх интерфейса, поэтому видны только края этих элементов. */
#splitdiv { position: fixed; z-index: 60; cursor: col-resize; display: grid; place-items: center; }
#splitdiv::after { content: ""; width: 4px; height: 44px; border-radius: 2px; background: var(--text-faint); opacity: .5; }
#splitdiv[hidden] { display: none; }
#splitdiv:hover::after, #splitdiv.drag::after { background: var(--accent); opacity: 1; }
#splitframe { position: fixed; border: 2px solid var(--accent); border-radius: 10px; pointer-events: none; opacity: .7; }
#edge { position: fixed; left: 0; top: 0; bottom: 0; width: var(--pad); cursor: e-resize; display: none; }
body.no-sidebar #edge { display: block; }

/* ===== Командная палитра: поле поиска с результатами ===== */
#palette {
  position: fixed; inset: 0; display: none; background: rgba(20, 20, 40, .18);
  backdrop-filter: blur(3px);
}
:root[data-theme="dark"] #palette { background: rgba(0, 0, 0, .35); }
#palette.open { display: block; }
#palette .box {
  position: absolute; left: 50%; top: 14vh; transform: translateX(-50%);
  width: min(640px, calc(100vw - 40px)); background: var(--panel);
  border-radius: 16px; box-shadow: var(--panel-shadow); overflow: hidden;
}
#palette .field { display: flex; align-items: center; gap: 10px; padding: 0 16px; }
#palette .field svg { width: 18px; height: 18px; color: var(--text-faint); }
#palette input {
  flex: 1; min-width: 0; height: 54px; border: 0; outline: 0; background: transparent;
  color: var(--text); font: 16px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  user-select: text;
}
#palette input::placeholder { color: var(--text-faint); }
#palette .hint { font-size: 11px; color: var(--text-faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
#results { border-top: 1px solid var(--line); padding: 6px; max-height: 60vh; overflow-y: auto; }
#results:empty { display: none; }
.res {
  display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 9px;
  cursor: default;
}
.res.sel { background: var(--accent-soft); }
.res .ico { width: 18px; text-align: center; color: var(--text-dim); flex: none; }
.res .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.res .u { color: var(--text-faint); font-size: 12px; margin-left: 8px; }
.res .kind { color: var(--text-faint); font-size: 11px; flex: none; }
.res.danger .t { color: var(--danger); }

/* ===== Поиск по странице (полоса над вкладкой) ===== */
#findbar {
  position: fixed; top: var(--pad); left: var(--sw); right: var(--pad); height: calc(var(--find-h) - 4px);
  display: flex; align-items: center; gap: 4px; padding: 0 6px 0 12px;
  background: var(--panel); box-shadow: var(--panel-shadow); border-radius: 10px;
}
#findbar[hidden] { display: none; }
body.no-sidebar #findbar { left: var(--pad); }
#findbar input {
  flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text);
  font: inherit; font-size: 14px; user-select: text;
}
#findbar input::placeholder { color: var(--text-faint); }
#findbar.miss input { color: var(--danger); }
#findcount { color: var(--text-dim); font-size: 12px; padding: 0 6px; white-space: nowrap; }

/* ===== Контекстное меню ===== */
#menu {
  position: fixed; display: none; min-width: min(196px, calc(var(--sw) - 12px)); padding: 5px; background: var(--panel);
  border-radius: 12px; box-shadow: var(--panel-shadow); z-index: 10;
}
#menu.open { display: block; }
#menu button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#menu button:hover { background: var(--hover); }
#menu button.danger { color: var(--danger); }
#menu .sep { height: 1px; background: var(--line); margin: 4px 6px; }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="toolbar">
    <div class="brand"><img id="brand-logo" alt=""><span>Seyro</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" data-cmd="toggle_sidebar" title="Скрыть панель (Ctrl+S)">
      <svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg>
    </button>
    <button class="icon-btn" data-cmd="new_tab" title="Новая вкладка (Ctrl+T)">
      <svg viewBox="0 0 16 16"><path d="M8.5 2.5H4a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 4 13.5h8a1.5 1.5 0 0 0 1.5-1.5V7.5"/><path d="m11.5 2.2 2.3 2.3L8.3 10H6V7.7z"/></svg>
    </button>
    <!-- Кнопки окна: только в режиме без рамки (custom_titlebar в config.json). -->
    <div class="winctl">
      <button class="icon-btn" data-cmd="win_min" title="Свернуть">
        <svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg>
      </button>
      <button class="icon-btn" data-cmd="win_max" id="win-max" title="Развернуть">
        <svg viewBox="0 0 16 16" class="ico-max"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>
        <svg viewBox="0 0 16 16" class="ico-restore"><rect x="3.5" y="5.5" width="7" height="7" rx="1.2"/><path d="M6 5.5V4.7c0-.7.5-1.2 1.2-1.2h4.1c.7 0 1.2.5 1.2 1.2v4.1c0 .7-.5 1.2-1.2 1.2h-.8"/></svg>
      </button>
      <button class="icon-btn close" data-cmd="win_close" title="Закрыть">
        <svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </div>

  <div class="navrow">
    <button class="icon-btn" data-cmd="back" title="Назад (Alt+←)">
      <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
    </button>
    <button class="icon-btn" data-cmd="forward" title="Вперёд (Alt+→)">
      <svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg>
    </button>
    <button class="icon-btn" data-cmd="reload" title="Обновить (Ctrl+R)">

<div id="menu"></div>

<script>
(() => {
  const cfg = window.SEYRO_CONFIG || { sidebarWidth: 260, padding: 8 };
  // ---------- Язык ----------
  // Как в i18n.rs: ключ перевода — сама русская строка; {0}, {1} — подстановки.
  // Язык выбирает Rust (как в Windows или "language" в config.json).
  const EN = {
    // Разметка: подписи и подсказки.
    'Библиотека': 'Library', 'Вкладки': 'Tabs', 'Закреплённые': 'Pinned', 'Новая вкладка': 'New Tab',
    'Обновить': 'Update', 'Откройте что-нибудь': 'Open something', 'Очистить': 'Clear', 'Поиск': 'Search',
    'Пространства': 'Spaces', 'вернуть закрытую': 'reopen closed tab', 'закрепить вкладку': 'pin tab',
    'изменить адрес': 'edit address', 'новая вкладка': 'new tab', 'скрыть / показать панель': 'hide / show sidebar',
    'Найти на странице…': 'Find in page…', 'Поиск или адрес…': 'Search or enter a URL…',
    'Вперёд (Alt+→)': 'Forward (Alt+→)', 'Назад (Alt+←)': 'Back (Alt+←)', 'Обновить (Ctrl+R)': 'Reload (Ctrl+R)',
    'Загрузки': 'Downloads', 'Закрыть (Esc)': 'Close (Esc)', 'Закрыть': 'Close',
    'Закрыть все незакреплённые вкладки (вернуть — Ctrl+Shift+T)': 'Close all unpinned tabs (Ctrl+Shift+T brings them back)',
    'Изменить адрес (Ctrl+L)': 'Edit address (Ctrl+L)', 'Новая вкладка (Ctrl+T)': 'New tab (Ctrl+T)',
    'Новое пространство: свои вкладки, куки и логины': 'New space with its own tabs, cookies and logins',
    'Поиск или адрес': 'Search or address', 'Показать панель': 'Show sidebar',
    'Потяните, чтобы изменить ширину половин': 'Drag to resize the halves',
    'Предыдущее (Shift+Enter)': 'Previous (Shift+Enter)', 'Следующее (Enter)': 'Next (Enter)',
    'Развернуть': 'Maximize', 'Восстановить': 'Restore', 'Свернуть': 'Minimize',
    'Скачать и установить новую версию; вкладки сохранятся': 'Download and install the new version; your tabs are kept',
    'Скрыть до следующего запуска': 'Hide until next launch', 'Скрыть панель (Ctrl+S)': 'Hide sidebar (Ctrl+S)',
    // Вкладки и меню.
    'Вернуться к закреплённому адресу': 'Back to the pinned address', 'Выгрузить (Ctrl+W)': 'Unload (Ctrl+W)',
    'Закрыть (Ctrl+W)': 'Close (Ctrl+W)', 'Выгрузить': 'Unload', 'Дублировать': 'Duplicate', 'Закрепить': 'Pin',
    'Открепить': 'Unpin', 'Копировать ссылку': 'Copy link', 'Ссылка скопирована': 'Link copied',
    'Закрыть разделение': 'Close split view', 'Открыть рядом с текущей': 'Open next to current',
    // Пространства.
    'Новое пространство': 'New space', 'Переименовать': 'Rename', 'Удалить…': 'Delete…',
    'Цвет пространства': 'Space color', 'Пространство: ': 'Space: ', 'пространство ': 'space ',
    'Новое имя пространства…': 'New space name…', 'Введите новое имя': 'Type a new name',
    'Назвать пространство «{0}»': 'Rename space to “{0}”', 'Удалить пространство?': 'Delete space?',
    'Удалить «{0}» вместе с вкладками, куки и логинами?': 'Delete “{0}” with its tabs, cookies and logins?',
    // Палитра.
    'Изменить адрес…': 'Edit address…', 'Поиск по загрузкам…': 'Search downloads…',
    'Что открыть рядом: вкладка, адрес или поиск…': 'Open alongside: a tab, address or search…',
    'Открыть': 'Open', 'Искать': 'Search', 'Перейти': 'Switch', 'Открыть рядом': 'Open alongside',
    'История': 'History', 'Команда': 'Command', 'Enter — да': 'Enter to confirm', 'Отмена': 'Cancel',
    'Открыть папку «Загрузки»': 'Open Downloads folder', 'Загрузок пока нет': 'No downloads yet',
    'Загружается': 'Downloading', 'Показать в папке': 'Show in folder', 'Не удалась': 'Failed',
    // Команды палитры.
    'Найти на странице': 'Find in page', 'Вернуть закрытую вкладку': 'Reopen closed tab',
    'Разделить экран: открыть рядом': 'Split screen: open alongside',
    'Закрыть все незакреплённые вкладки': 'Close all unpinned tabs', 'Инструменты разработчика': 'Developer tools',
    'Очистить историю': 'Clear history', 'Удалить всю историю посещений?': 'Delete your entire browsing history?',
    'Очистить данные сайтов': 'Clear site data',
    'Удалить куки, кэш и пароли сайтов в этом пространстве?': 'Delete cookies, cache and saved passwords for this space?',
    'Переименовать пространство': 'Rename space', 'Удалить пространство': 'Delete space',
    'Сделать Seyro браузером по умолчанию': 'Make Seyro the default browser', 'Проверить обновления': 'Check for updates',
    'Сменить тему: как в Windows, светлая, тёмная': 'Change theme: system, light, dark',
    // Поиск по странице и обновление.
    ' из ': ' of ', 'не найдено': 'no matches', 'Скачиваю…': 'Downloading…',
    // Домашняя страница.
    'Главная': 'Home', 'Доброе утро': 'Good morning', 'Добрый день': 'Good afternoon', 'Добрый вечер': 'Good evening',
    'Доброй ночи': 'Good night', 'Спокойный интернет для глубокой работы.': 'A calmer internet for deeper work.',
    'Продолжить': 'Continue browsing', 'Здесь появятся сайты, которые вы часто открываете.': 'Sites you visit often will show up here.',
  };
  const tr = (s, ...args) => {
    let r = (cfg.lang === 'en' && EN[s]) || s;
    args.forEach((a, i) => { r = r.replace('{' + i + '}', a); });
    return r;
  };
  // Статическая разметка переводится один раз: тексты, подсказки и заглушки полей.
  (function translatePage() {
    if (cfg.lang !== 'en') return;
    document.documentElement.lang = 'en';
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    for (let n; (n = walker.nextNode());) {
      const k = n.data.trim();
      if (EN[k]) n.data = n.data.replace(k, EN[k]);
    }
    for (const el of document.querySelectorAll('[title], [placeholder]')) {
      for (const a of ['title', 'placeholder']) {
        const v = el.getAttribute(a);
        if (v && EN[v]) el.setAttribute(a, EN[v]);
      }
    }
  })();

  document.documentElement.style.setProperty('--sw', cfg.sidebarWidth + 'px');
  document.documentElement.style.setProperty('--pad', cfg.padding + 'px');
  document.body.classList.toggle('frameless', !!cfg.frameless);
  if (cfg.logo) { document.getElementById('logo').src = cfg.logo; document.getElementById('brand-logo').src = cfg.logo; }

  const $ = (s) => document.querySelector(s);
  const post = (m) => window.ipc.postMessage(JSON.stringify(m));
  let state = { tabs: [], active: null, sidebar: true, palette: false };

  // ---------- Отрисовка вкладок ----------
  function hostOf(url) {
    try { const u = new URL(url); return u.host || url; } catch (_) { return url || ''; }
  }

  function favEl(t) {
    const box = document.createElement('div');
    box.className = 'fav';
    const letter = () => { box.textContent = (t.title || hostOf(t.url) || '?').trim().charAt(0).toUpperCase(); };
    if (t.favicon && /^(https?:|data:image\/)/.test(t.favicon)) {
      const img = document.createElement('img');
      img.src = t.favicon;
      img.onerror = () => { img.remove(); letter(); };
      box.appendChild(img);
      box.style.background = 'transparent';
    } else letter();
    return box;
  }

  function tabEl(t) {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === state.active ? ' active' : '') + (t.asleep ? ' asleep' : '') + (t.loading ? ' loading' : '');
    el.draggable = true;
    el.dataset.id = t.id;
    el.title = (t.title ? t.title + '\n' : '') + t.url;
    el.appendChild(favEl(t));
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = t.title || hostOf(t.url) || tr('Новая вкладка');
    el.appendChild(title);
    if (t.media) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = '🔊'; el.appendChild(b); }
    if (t.drifted) {
      const b = document.createElement('button'); b.className = 'badge'; b.textContent = '↺';
      b.title = tr('Вернуться к закреплённому адресу');
      b.onclick = (e) => { e.stopPropagation(); post({ type: 'reset_pinned', id: t.id }); };
      el.appendChild(b);
    }
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '×';
    x.title = t.pinned ? tr('Выгрузить (Ctrl+W)') : tr('Закрыть (Ctrl+W)');
    x.onclick = (e) => { e.stopPropagation(); post({ type: 'close', id: t.id }); };
    el.appendChild(x);

    el.onmousedown = (e) => { if (e.button === 1) e.preventDefault(); };
    el.onmouseup = (e) => { if (e.button === 1) post({ type: 'close', id: t.id }); };
    el.onclick = () => post({ type: 'activate', id: t.id });
    el.oncontextmenu = (e) => { e.preventDefault(); openMenu(e.clientX, e.clientY, t); };
    el.ondragstart = (e) => { e.dataTransfer.setData('text/seyro-tab', String(t.id)); e.dataTransfer.effectAllowed = 'move'; };
    return el;
  }

  // ---------- Домашняя страница ----------
  function greeting() {
    const h = new Date().getHours();
    return h < 5 ? tr('Доброй ночи') : h < 12 ? tr('Доброе утро') : h < 18 ? tr('Добрый день') : tr('Добрый вечер');
  }
  // Значок сайта: favicon с самого сайта, если не загрузился — первая буква.
  function siteIcon(url, label, cls) {
    const box = document.createElement('span');
    box.className = cls;
    const letter = () => { box.textContent = (label || '?').trim().charAt(0).toUpperCase(); };
    try {
      const img = document.createElement('img');
      img.src = new URL(url).origin + '/favicon.ico';
      img.onerror = () => { img.remove(); letter(); };
      box.appendChild(img);
    } catch (_) { letter(); }
    return box;
  }
  function renderHome() {
    const home = state.home;
    document.body.classList.toggle('home', !!home);
    if (!home) return;
    $('#greet').textContent = greeting();
    $('#tiles').replaceChildren(...home.top.map((s) => {
      const el = document.createElement('button');
      el.className = 'tile';
      el.title = s.url;
      const name = document.createElement('span');
      name.className = 'tname';
      name.textContent = s.host.replace(/\.(com|org|net|ru|io|dev|app)$/, '');
      el.append(siteIcon(s.url, s.host, 'tico'), name);
      el.onclick = () => post({ type: 'navigate', text: s.url, mode: 'new' });
      return el;
    }));
    $('#tiles-empty').hidden = home.top.length > 0;
    $('#recent-card').hidden = !home.recent.length;
    $('#recent').replaceChildren(...home.recent.map((e) => {
      const el = document.createElement('button');
      el.className = 'recent-row';
      el.title = e.url;
      const text = document.createElement('span');
      text.className = 'rtext';
      const title = document.createElement('div');
      title.className = 'rtitle';
      title.textContent = e.title || hostOf(e.url);
      const host = document.createElement('div');
      host.className = 'rhost';
      host.textContent = hostOf(e.url);
      text.append(title, host);
      el.append(siteIcon(e.url, e.title || hostOf(e.url), 'rico'), text);
      el.onclick = () => post({ type: 'navigate', text: e.url, mode: 'new' });
      return el;
    }));
  }
  // ---------- Обновление ----------
  function renderUpdate() {
    const u = state.update, bar = $('#update');
    bar.hidden = !u && !state.updating;
    if (bar.hidden) return;
    $('#update-text').textContent = state.updating ? tr('Скачиваю…') : 'Seyro ' + u.version;
    $('.update-go').disabled = !!state.updating;
    $('.update-x').hidden = !!state.updating;
  }

  // ---------- Пространства ----------
  // Ключи — те же, что spaces::COLORS в Rust.
  const SPACE_COLORS = {
    violet: '#6c5cf5', blue: '#3b82f6', teal: '#14b8a6', green: '#22c55e',
    orange: '#f97316', rose: '#f43f5e', gray: '#8b8f99',
  };
  const colorOf = (key) => SPACE_COLORS[key] || SPACE_COLORS.violet;
  const curSpace = () => (state.spaces || [])[state.activeSpace] || { name: '', color: 'violet', main: true };

  function renderSpaces() {
    // Цвет пространства — в значке и лёгким оттенком в фоне окна.
    document.documentElement.style.setProperty('--space', colorOf(curSpace().color));
    $('#spacesbar').replaceChildren(...(state.spaces || []).map((s, i) => {
      const el = document.createElement('button');
      el.className = 'row space-row' + (i === state.activeSpace ? ' active' : '');
      el.title = s.name + (i < 9 ? ` (Ctrl+Shift+${i + 1})` : '');
      const ico = document.createElement('span');
      ico.className = 'space-ico';
      ico.style.background = colorOf(s.color);
      ico.textContent = (s.name.trim()[0] || '?').toUpperCase();
      const name = document.createElement('span');
      name.className = 'rt';
      name.textContent = s.name;
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = s.tabs || '';
      el.append(ico, name, count);
      el.onclick = () => post({ type: 'space', index: i });
      el.oncontextmenu = (e) => { e.preventDefault(); openSpaceMenu(e.clientX, e.clientY, i); };
      return el;
    }));
  }

  // Меню пространства. Переименование и удаление работают с активным пространством,
  // поэтому сначала переходим в выбранное.
  function openSpaceMenu(x, y, i) {
    const s = state.spaces[i];
    const go = (k) => () => { post({ type: 'space', index: i }); post({ type: 'key', k }); };
    const sw = document.createElement('div');
    sw.className = 'swatches';
    for (const key of Object.keys(SPACE_COLORS)) {
      const b = document.createElement('button');
      b.style.background = SPACE_COLORS[key];
      b.className = key === s.color ? 'cur' : '';
      b.title = tr('Цвет пространства');
      b.onclick = () => { closeMenu(); post({ type: 'space_color', index: i, color: key }); };
      sw.appendChild(b);
    }
    const sep = () => Object.assign(document.createElement('div'), { className: 'sep' });
    const items = [[tr('Новое пространство'), () => post({ type: 'key', k: 'space_new' })], [tr('Переименовать'), go('rename_space')], sep(), sw];
    if (!s.main) {
      const del = document.createElement('button');
      del.className = 'danger';
      del.textContent = tr('Удалить…');
      del.onclick = () => { closeMenu(); go('delete_space_confirm')(); };
      items.push(sep(), del);
    }
    showMenu(x, y, items);
  }
  // ---------- Split View ----------
  const splitOf = (id) => (state.splits || []).find((p) => p.left === id || p.right === id);

  // Пара — одна строка; data-id у неё — левая половина (за неё пару и перетаскивают).
  function splitEl(p) {
    const left = state.tabs.find((t) => t.id === p.left), right = state.tabs.find((t) => t.id === p.right);
    const el = document.createElement('div');
    el.className = 'tab split' + (splitOf(state.active) === p ? ' shown' : '');
    el.dataset.id = p.left;
    el.append(tabEl(left), tabEl(right));
    return el;
  }

  // Вкладки раздела: правая половина пары рисуется внутри строки левой.
  function rows(list) {
    return list.flatMap((t) => {
      const p = splitOf(t.id);
      if (!p) return [tabEl(t)];
      if (p.right === t.id || !state.tabs.some((x) => x.id === p.right)) return [];
      return [splitEl(p)];
    });
  }

  // Разделитель и рамка — та же геометрия, что split_boxes в app.rs.
  function placeSplit() {
    const p = splitOf(state.active), show = !!p && !state.palette;
    $('#splitdiv').hidden = $('#splitframe').hidden = !show;
    if (!show) return;
    const pad = cfg.padding, gap = state.splitGap || 8;
    const x = state.sidebar ? cfg.sidebarWidth : pad, y = pad + (state.find ? 40 : 0);
    const w = innerWidth - x - pad, h = innerHeight - y - pad;
    const inner = Math.max(0, w - gap), lw = Math.round(inner * p.ratio);
    Object.assign($('#splitdiv').style, { left: x + lw + 'px', top: y + 'px', width: gap + 'px', height: h + 'px' });
    const [bx, bw] = state.active === p.left ? [x, lw] : [x + lw + gap, inner - lw];
    Object.assign($('#splitframe').style, { left: bx - 3 + 'px', top: y - 3 + 'px', width: bw + 6 + 'px', height: h + 6 + 'px' });
  }
  addEventListener('resize', placeSplit);

  // Перетаскивание разделителя: половины двигаются сразу, сохранение — когда отпустили.
  let splitDrag = null;
  $('#splitdiv').addEventListener('pointerdown', (e) => {
    const p = splitOf(state.active);
    if (!p || e.button !== 0) return;
    e.preventDefault();
    $('#splitdiv').setPointerCapture(e.pointerId);
    $('#splitdiv').classList.add('drag');
    splitDrag = { p, pending: false };
  });
  $('#splitdiv').addEventListener('pointermove', (e) => {
    if (!splitDrag) return;
    const pad = cfg.padding, gap = state.splitGap || 8, x = state.sidebar ? cfg.sidebarWidth : pad;
    const inner = Math.max(1, innerWidth - x - pad - gap);
    splitDrag.p.ratio = Math.min(0.8, Math.max(0.2, (e.clientX - x - gap / 2) / inner));
    placeSplit();
    if (!splitDrag.pending) {
      splitDrag.pending = true;
      requestAnimationFrame(() => {
        if (!splitDrag) return;
        splitDrag.pending = false;
        post({ type: 'split_ratio', ratio: splitDrag.p.ratio });
      });
    }
  });
  const splitDragEnd = () => {
    if (!splitDrag) return;
    post({ type: 'split_ratio', ratio: splitDrag.p.ratio, done: true });
    splitDrag = null;
    $('#splitdiv').classList.remove('drag');
  };
  $('#splitdiv').addEventListener('pointerup', splitDragEnd);
  $('#splitdiv').addEventListener('lostpointercapture', splitDragEnd);

  // ---------- Тема ----------
  // state.theme: 'system' (как в Windows), 'light' или 'dark'.
  const darkSystem = matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    const t = state.theme || 'system';
    const dark = t === 'dark' || (t === 'system' && darkSystem.matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  }
  darkSystem.addEventListener('change', applyTheme);
  applyTheme();

  function render(s) {
    state = s;
    applyTheme();
    document.body.classList.toggle('no-sidebar', !s.sidebar);
    document.body.classList.toggle('maximized', !!s.maximized);
    $('#win-max').title = s.maximized ? tr('Восстановить') : tr('Развернуть');
    const pinned = $('#pinned'), today = $('#today');
    pinned.replaceChildren(...rows(s.tabs.filter((t) => t.pinned)));
    today.replaceChildren(...rows(s.tabs.filter((t) => !t.pinned)));
    placeSplit();
    renderSpaces();
    renderUpdate();
    renderHome();
    $('#nav-home').classList.toggle('active', !!s.home);
    $('#pinned-label').style.display = 'block';

    const act = s.tabs.find((t) => t.id === s.active);
    const host = $('#urlbar .host');
    host.textContent = act ? hostOf(act.url) : tr('Новая вкладка');
    $('#urlbar').title = act ? act.url : 'Ctrl+L';
    $('#content').style.visibility = act && !s.palette ? 'hidden' : 'visible';
    $('#content > div').style.visibility = act ? 'hidden' : 'visible';
    if (!s.palette) $('#palette').classList.remove('open');
    $('#findbar').hidden = !s.find || s.palette;
  }

  // ---------- Перетаскивание ----------
  function clearDrop() {
    document.querySelectorAll('.drop-before,.drop-after,.drop-end').forEach((n) => n.classList.remove('drop-before', 'drop-after', 'drop-end'));
  }
  for (const list of [$('#pinned'), $('#today')]) {
    list.addEventListener('dragover', (e) => {
      if (!e.dataTransfer.types.includes('text/seyro-tab')) return;
      e.preventDefault();
      clearDrop();
      const row = e.target.closest('.list > .tab');
      if (row) {
        const r = row.getBoundingClientRect();
        row.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
      } else list.classList.add('drop-end');
    });
    list.addEventListener('dragleave', (e) => { if (!list.contains(e.relatedTarget)) clearDrop(); });
    list.addEventListener('drop', (e) => {
      e.preventDefault();
      const id = Number(e.dataTransfer.getData('text/seyro-tab'));
      const row = e.target.closest('.list > .tab');
      let before = null;
      if (row) {
        const r = row.getBoundingClientRect();
        const target = e.clientY < r.top + r.height / 2 ? row : row.nextElementSibling;
        before = target ? Number(target.dataset.id) : null;
      }
      if (before === id) before = null;
      clearDrop();
      post({ type: 'move', id, before, pinned: list.dataset.pinned === '1' });
    });
  }
  // Пустой блок «Закреплённые» тоже принимает перетаскивание.
  $('#pinned-label').addEventListener('dragover', (e) => e.preventDefault());
  $('#pinned-label').addEventListener('drop', (e) => {
    e.preventDefault();
    const id = Number(e.dataTransfer.getData('text/seyro-tab'));
    if (id) post({ type: 'move', id, before: null, pinned: true });
  });

  // ---------- Контекстное меню ----------
  function openMenu(x, y, t) {
    const m = $('#menu');
    const items = [
      [t.pinned ? tr('Открепить') : tr('Закрепить'), () => post({ type: t.pinned ? 'unpin' : 'pin', id: t.id })],
      [tr('Копировать ссылку'), () => { copy(t.url); toast(tr('Ссылка скопирована')); }],
      [tr('Дублировать'), () => post({ type: 'navigate', text: t.url, mode: 'new' })],
    ];
    if (splitOf(t.id)) items.push([tr('Закрыть разделение'), () => post({ type: 'unsplit', id: t.id })]);
    else if (state.active && t.id !== state.active) items.push([tr('Открыть рядом с текущей'), () => post({ type: 'split', id: t.id })]);
    items.push([t.pinned ? tr('Выгрузить') : tr('Закрыть'), () => post({ type: 'close', id: t.id })]);
    showMenu(x, y, items);
  }

  // Пункты меню: [подпись, действие] или готовый элемент.
  function showMenu(x, y, items) {
    const m = $('#menu');
    m.replaceChildren(...items.map((it) => {
      if (it instanceof Node) return it;
      const [label, fn] = it;
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = () => { closeMenu(); fn(); };
      return b;
    }));
    // Страница вкладки — отдельное окно поверх интерфейса, и меню, заехавшее на неё,
    // окажется под ней. Поэтому меню всегда целиком внутри сайдбара.
    const edge = state.sidebar ? cfg.sidebarWidth : innerWidth;
    m.style.maxWidth = edge - 12 + 'px';
    m.classList.add('open');
    const r = m.getBoundingClientRect();
    m.style.left = Math.max(6, Math.min(x, edge - r.width - 6)) + 'px';
    m.style.top = Math.max(6, Math.min(y, innerHeight - r.height - 6)) + 'px';
  }
  const closeMenu = () => $('#menu').classList.remove('open');
  addEventListener('mousedown', (e) => { if (!e.target.closest('#menu')) closeMenu(); });

  function copy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }

  // ---------- Тосты ----------
  let toastTimer;
  function toast(text) {
    const el = $('#toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // ---------- Командная палитра ----------
  // pMode: 'new' | 'edit' | 'downloads'. items — история (или загрузки в режиме 'downloads').
  let pMode = 'new', items = [], results = [], sel = 0;

  // Команды палитры: находятся по названию. confirm — текст подтверждения для необратимых.
  const COMMANDS = [
    { k: 'find', t: tr('Найти на странице'), hint: 'Ctrl+F' },
    { k: 'downloads', t: tr('Загрузки'), hint: 'Ctrl+J' },
    { k: 'reopen', t: tr('Вернуть закрытую вкладку'), hint: 'Ctrl+Shift+T' },
    { k: 'split', t: tr('Разделить экран: открыть рядом') },
    { k: 'unsplit', t: tr('Закрыть разделение') },
    { k: 'clear', t: tr('Закрыть все незакреплённые вкладки') },
    { k: 'devtools', t: tr('Инструменты разработчика'), hint: 'F12' },
    { k: 'clear_history', t: tr('Очистить историю'), confirm: tr('Удалить всю историю посещений?') },
    { k: 'clear_data', t: tr('Очистить данные сайтов'), confirm: tr('Удалить куки, кэш и пароли сайтов в этом пространстве?') },
    { k: 'space_new', t: tr('Новое пространство') },
    { k: 'default_browser', t: tr('Сделать Seyro браузером по умолчанию') },
    { k: 'check_updates', t: tr('Проверить обновления') },
    { k: 'theme', t: tr('Сменить тему: как в Windows, светлая, тёмная') },
    { k: 'rename_space', t: tr('Переименовать пространство') },
    { k: 'delete_space_confirm', t: tr('Удалить пространство'), notMain: true },
  ];
  const DL_STATE = { running: ['⟳', tr('Загружается')], done: ['✓', tr('Показать в папке')], failed: ['✕', tr('Не удалась')] };

  function openPalette(mode, current, list) {
    pMode = mode;
    items = list || [];
    const input = $('#pinput');
    input.value = mode === 'edit' || mode === 'rename_space' ? current : '';
    input.placeholder = {
      edit: tr('Изменить адрес…'), downloads: tr('Поиск по загрузкам…'), split: tr('Что открыть рядом: вкладка, адрес или поиск…'),
      rename_space: tr('Новое имя пространства…'), delete_space: tr('Удалить пространство?'),
    }[mode] || tr('Поиск или адрес…');
    $('#palette').classList.add('open');
    closeMenu();
    update();
    input.focus();
    input.select();
  }

  function looksLikeUrl(q) {
    return /^[a-z]+:\/\//i.test(q) || (!/\s/.test(q) && /^[^\s.]+(\.[^\s.]+)+(:\d+)?(\/.*)?$/.test(q) && /\.[a-zа-я-]{2,}(:\d+)?(\/|$)/i.test(q)) || /^localhost(:\d+)?/i.test(q);
  }

  function update() {
    const q = $('#pinput').value.trim();
    const ql = q.toLowerCase();
    const match = (s) => (s || '').toLowerCase().includes(ql);
    results = [];
    if (pMode === 'rename_space') {
      results.push(q
        ? { kind: 'rename', ico: '✎tr(', t: tr('Назвать пространство «{0}»', q), sub: ')Enter', name: q }
        : { kind: 'none', ico: '✎', t: tr('Введите новое имя'), sub: '' });
      sel = 0;
      drawResults();
      return;
    }
    if (pMode === 'delete_space') {
      results = [
        { kind: 'cmd', ico: '!', danger: true, k: 'delete_space', sub: tr('Enter — да'),
          t: tr('Удалить «{0}» вместе с вкладками, куки и логинами?', curSpace().name) },
        { kind: 'cancel', ico: '×', t: tr('Отмена'), sub: 'Esc' },
      ];
      sel = 0;
      drawResults();
      return;
    }
    if (pMode === 'downloads') {
      results.push({ kind: 'cmd', ico: '📁', t: tr('Открыть папку «Загрузки»'), sub: '', k: 'open_downloads_folder' });
      for (const d of items.filter((d) => !ql || match(d.name) || match(d.url)).slice(0, 50)) {
        const [ico, sub] = DL_STATE[d.state] || DL_STATE.failed;
        results.push({ kind: 'dl', ico, t: d.name, u: hostOf(d.url), sub, id: d.id });
      }
      if (!items.length) results.push({ kind: 'none', ico: '', t: tr('Загрузок пока нет'), sub: '' });
      sel = 0;
      drawResults();
      return;
    }
    if (q) {
      results.push(looksLikeUrl(q)
        ? { kind: 'go', ico: '↗', t: q, sub: tr('Открыть'), text: q }
        : { kind: 'go', ico: '⌕', t: q, sub: tr('Искать'), text: q });
    }
    const tabs = state.tabs.filter((t) => t.id !== state.active && (!ql || match(t.title) || match(t.url)));
    for (const t of tabs.slice(0, ql ? 4 : 6)) {
      results.push({ kind: 'tab', ico: '⇥', t: t.title || hostOf(t.url), u: hostOf(t.url), sub: pMode === 'split' ? tr('Открыть рядом') : tr('Перейти'), id: t.id });
    }
    if (ql) {
      const openUrls = new Set(state.tabs.map((t) => t.url));
      const hits = items.filter((h) => !openUrls.has(h.url) && (match(h.title) || match(h.url)));
      // Сначала совпадения по началу домена, потом по частоте посещений.
      hits.sort((a, b) => (hostOf(b.url).startsWith(ql) - hostOf(a.url).startsWith(ql)) || (b.visits - a.visits));
      for (const h of hits.slice(0, 6)) {
        results.push({ kind: 'hist', ico: '◷', t: h.title || h.url, u: hostOf(h.url), sub: tr('История'), text: h.url });
      }
      if (pMode !== 'split') {
        (state.spaces || []).forEach((s, i) => {
          if (i !== state.activeSpace && (match(s.name) || match(tr('пространство ') + s.name))) {
            results.push({ kind: 'space', ico: '◆', t: tr('Пространство: ') + s.name, sub: i < 9 ? 'Ctrl+Shift+' + (i + 1) : '', index: i });
          }
        });
      }
      const canRun = (c) => pMode !== 'split' && !(c.notMain && curSpace().main);
      for (const c of COMMANDS.filter((c) => canRun(c) && match(c.t)).slice(0, 4)) {
        results.push({ kind: 'cmd', ico: '›', t: c.t, sub: c.hint || tr('Команда'), k: c.k, confirm: c.confirm });
      }
    }
    sel = 0;
    drawResults();
  }

  // Для необратимой команды вместо выполнения показываем вопрос с подтверждением.
  function askConfirm(r) {
    results = [
      { kind: 'cmd', ico: '!', t: r.confirm, sub: tr('Enter — да'), k: r.k, danger: true },
      { kind: 'cancel', ico: '×', t: tr('Отмена'), sub: 'Esc' },
    ];
    sel = 0;
    drawResults();
  }

  function drawResults() {
    $('#results').replaceChildren(...results.map((r, i) => {
      const el = document.createElement('div');
      el.className = 'res' + (i === sel ? ' sel' : '') + (r.danger ? ' danger' : '');
      const ico = document.createElement('span'); ico.className = 'ico'; ico.textContent = r.ico;
      const t = document.createElement('span'); t.className = 't'; t.textContent = r.t;
      if (r.u) { const u = document.createElement('span'); u.className = 'u'; u.textContent = r.u; t.appendChild(u); }
      const k = document.createElement('span'); k.className = 'kind'; k.textContent = r.sub;
      el.append(ico, t, k);
      el.onmousemove = () => { if (sel !== i) { sel = i; drawResults(); } };
      el.onclick = () => choose(i);
      return el;
    }));
  }

  function choose(i) {
    const r = results[i];
    if (!r || r.kind === 'none') return;
    if (r.kind === 'cancel') { closePalette(); return; }
    if (r.kind === 'cmd' && r.confirm) { askConfirm(r); return; }
    $('#palette').classList.remove('open');
    if (r.kind === 'tab') post({ type: pMode === 'split' ? 'split' : 'activate', id: r.id });
    else if (r.kind === 'cmd') { post({ type: 'palette_close' }); post({ type: 'key', k: r.k }); }
    else if (r.kind === 'dl') { post({ type: 'palette_close' }); post({ type: 'open_download', id: r.id }); }
    else if (r.kind === 'space') { post({ type: 'palette_close' }); post({ type: 'space', index: r.index }); }
    else if (r.kind === 'rename') post({ type: 'space_rename', name: r.name });
    else post({ type: 'navigate', text: r.text, mode: pMode });
  }

  $('#pinput').addEventListener('input', update);
  $('#pinput').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, results.length - 1); drawResults(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); drawResults(); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(sel); }
    else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
  });
  function closePalette() { $('#palette').classList.remove('open'); post({ type: 'palette_close' }); }
  $('#palette').addEventListener('mousedown', (e) => { if (e.target.id === 'palette') closePalette(); });

  // ---------- Поиск по странице ----------
  // Ищет скрипт во вкладке (find_script в app.rs), сюда приходит только число совпадений.
  const findInput = $('#findinput');
  function openFind() {
    $('#findbar').hidden = false;
    findInput.focus();
    findInput.select();
    if (findInput.value) runFind('type');
  }
  const runFind = (mode) => post({ type: 'find', text: findInput.value, mode });
  // r: { n — число совпадений, i — номер текущего с нуля или null }.
  function findResult(r) {
    const q = findInput.value;
    $('#findcount').textContent = !q ? '' : r.n > 0 ? (r.i + 1) + tr(' из ') + r.n : tr('не найдено');
    $('#findbar').classList.toggle('miss', !!q && r.n === 0);
  }
  findInput.addEventListener('input', () => runFind('type'));
  findInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); runFind(e.shiftKey ? 'prev' : 'next'); }
    else if (e.key === 'Escape') { e.preventDefault(); post({ type: 'find_close' }); }
  });
  $('#findnext').onclick = () => runFind('next');
  $('#findprev').onclick = () => runFind('prev');
  $('#findclose').onclick = () => post({ type: 'find_close' });

  // ---------- Окно без рамки ----------
  // Тянуть окно — за пустое место сайдбара: верхнюю панель, фон под вкладками,
  // подписи (или за рамку над страницей, если сайдбар скрыт). Двойной клик там —
  // развернуть. Сам перенос делает Windows (drag_window в app.rs).
  const DRAG_AREAS = '.toolbar, #topdrag, #sidebar, #scroll, .list, .divider, .section-label, .footer';
  function dragStart(e) {
    if (!document.body.classList.contains('frameless') || e.button !== 0) return;
    const t = e.target;
    if (t.closest('button, .tab, #urlbar') || !(t.matches(DRAG_AREAS) || t.closest('.toolbar'))) return;
    e.preventDefault();
    post(e.detail === 2 ? { type: 'key', k: 'win_max' } : { type: 'drag' });
  }
  addEventListener('mousedown', dragStart);
  document.querySelectorAll('#resize [data-dir]').forEach((el) => el.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    post({ type: 'resize', dir: el.dataset.dir });
  }));

  // ---------- Кнопки и горячие клавиши ----------
  document.querySelectorAll('[data-cmd]').forEach((b) => b.addEventListener('click', () => post({ type: 'key', k: b.dataset.cmd })));
  $('#urlbar').onclick = () => post({ type: 'key', k: 'edit_url' });
  $('#newtab').onclick = () => post({ type: 'key', k: 'new_tab' });
  $('#home-search').onclick = () => post({ type: 'key', k: 'new_tab' });
  $('#edge').onclick = () => post({ type: 'key', k: 'toggle_sidebar' });

  addEventListener('keydown', (e) => {
    const c = e.ctrlKey || e.metaKey, s = e.shiftKey;
    // Клавиша по физическому месту, а не по букве — работает на любой раскладке.
    // e.code бывает пустым (удалённый рабочий стол, программные нажатия), тогда
    // смотрим e.keyCode — это виртуальный код Windows, он тоже не зависит от раскладки.
    const key = (ch) => e.code === 'Key' + ch || (!e.code && e.keyCode === ch.charCodeAt(0));
    const digit = e.code ? (/^Digit([1-9])$/.exec(e.code) || [])[1]
      : (e.keyCode >= 49 && e.keyCode <= 57 ? String(e.keyCode - 48) : undefined);
    let k = null;
    if (c && !e.altKey) {
      if (key('T')) k = s ? 'reopen' : 'new_tab';
      else if (key('L')) k = 'edit_url';
      else if (key('W')) k = 'close';
      else if (e.key === 'Tab') k = s ? 'prev' : 'next';
      else if (key('S') && !s) k = 'toggle_sidebar';
      else if (key('D') && !s) k = 'pin';
      else if (key('R')) k = 'reload';
      else if (key('F') && !s) k = 'find';
      else if (key('J') && !s) k = 'downloads';
      else if (digit) k = (s ? 'space:' : 'goto:') + digit;
    } else if (e.altKey && !c && e.key === 'ArrowLeft') k = 'back';
    else if (e.altKey && !c && e.key === 'ArrowRight') k = 'forward';
    else if (e.key === 'F5') k = 'reload';
    else if (e.key === 'Escape' && $('#palette').classList.contains('open')) { closePalette(); return; }
    if (!k) return;
    // Пока открыта палитра, не даём переключать вкладки клавишами.
    if ($('#palette').classList.contains('open') && !['new_tab', 'edit_url'].includes(k)) return;
    e.preventDefault();
    post({ type: 'key', k });
  }, true);
  addEventListener('contextmenu', (e) => { if (!e.target.closest('input')) e.preventDefault(); });

  window.seyro = { render, toast, openPalette, openFind, findResult };
  post({ type: 'ready' });
})();
</script>
</body>
</html>
