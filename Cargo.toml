[package]
name = "jiyda"
version = "0.6.1"
edition = "2024"
# Не публикуется на crates.io (и cargo-deny не требует лицензии у самого Jiyda).
publish = false
description = "Jiyda — Arc-подобный браузер на Rust поверх WebView2"

[dependencies]
dirs = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tao = "0.37"
url = "2"
wry = { version = "0.57", features = ["devtools"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Те же версии, что использует wry: горячие клавиши через событие WebView2 и буфер обмена.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security_Credentials",
    "Win32_System_SystemInformation",
] }

[build-dependencies]
winresource = "0.1"
