[package]
name = "drift"
version = "0.1.0"
edition = "2024"
description = "Arc-подобный браузер на Rust поверх WebView2"

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
url = "2"
wry = { version = "0.57", features = ["devtools"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
