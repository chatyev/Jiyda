[package]
name = "drift"
version = "0.1.0"
edition = "2024"
description = "Arc-подобный браузер на Rust поверх WebView2"

[dependencies]
dirs = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tao = "0.37"
url = "2"
wry = { version = "0.57", features = ["devtools"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Те же версии, что использует wry: горячие клавиши через событие WebView2 и буфер обмена.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
] }
