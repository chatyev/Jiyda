# Cloudflare Worker приёма статистики Jiyda (README.md рядом — как развернуть).
name = "jiyda-telemetry"
main = "worker.js"
compatibility_date = "2026-10-01"

# Журнал запросов Cloudflare не включаем: в нём были бы IP-адреса.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "jiyda-telemetry"
# Вставьте сюда database_id из вывода `wrangler d1 create jiyda-telemetry`.
database_id = "REPLACE_WITH_DATABASE_ID"
