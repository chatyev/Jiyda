# Сборка Seyro под Windows на GitHub: при каждом push собирается seyro.exe,
# скачать его можно во вкладке Actions → последний запуск → Artifacts.
name: windows-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: seyro-windows
          path: target/release/seyro.exe
