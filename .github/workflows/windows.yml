# Сборка Jiyda под Windows на GitHub.
# При каждом push собираются jiyda.exe и установщик JiydaSetup-<версия>.exe —
# их можно скачать во вкладке Actions → последний запуск → Artifacts.
# При метке вида v0.2.0 (git tag v0.2.0 && git push --tags) установщик
# выкладывается в Releases с описанием из docs/releases/<метка>.md (на английском).
name: windows-build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Форматирование
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Проверка интерфейса (открыть и закрыть каждый слой, без ошибок JS)
        shell: pwsh
        timeout-minutes: 14
        run: |
          cargo build
          # Обе рамки окна: обычная Windows и своя (frame.rs); итог — после обеих.
          $shots = Join-Path $env:RUNNER_TEMP 'smoke-shots'
          ./scripts/ui-smoke.ps1 -NativeFrame -TimeoutSec 150 -ShotDir $shots; $native = $LASTEXITCODE
          ./scripts/ui-smoke.ps1 -TimeoutSec 150 -ShotDir $shots; $own = $LASTEXITCODE
          if ($native -or $own) { exit 1 }
      - name: Снимки экрана при сбое проверки интерфейса
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-shots
          path: ${{ runner.temp }}/smoke-shots
          if-no-files-found: ignore

      - name: Версия из метки совпадает с Cargo.toml, release notes написаны
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($cargo -ne $tag) { throw "Метка v$tag, а в Cargo.toml версия $cargo" }
          if (-not (Test-Path "docs/releases/${{ github.ref_name }}.md")) {
            throw "Нет release notes: docs/releases/${{ github.ref_name }}.md (на английском)"
          }

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Установщик
        shell: pwsh
        run: ./installer/build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: jiyda-windows
          path: |
            target/release/jiyda.exe
            target/installer/JiydaSetup-*.exe

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Jiyda ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          # Seyro 0.5.0 обновляется через отдельный репозиторий-мост chatyev/seyro (релиз 0.6.0
          # с SeyroSetup-0.6.0.exe): адреса этого репозитория он не принимает.
          files: target/installer/JiydaSetup-*.exe
