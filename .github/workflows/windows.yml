# Сборка Jiyda под Windows на GitHub.
# При каждом push собираются jiyda.exe и установщик JiydaSetup-<версия>.exe —
# их можно скачать во вкладке Actions → последний запуск → Artifacts.
# При метке вида v0.2.0 (git tag v0.2.0 && git push --tags) установщик
# выкладывается в Releases с описанием из docs/releases/<метка>.md (на английском).
name: windows-build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Форматирование
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Уязвимости (база RustSec, как cargo audit), лицензии и источники зависимостей — deny.toml.
      - name: Зависимости
        run: cargo deny check
      - run: cargo test
      - name: E2E (настоящий браузер, tests/e2e)
        shell: pwsh
        timeout-minutes: 30
        run: |
          cargo build
          # Обе рамки окна: своя (frame.rs) и обычная Windows; итог — после обеих.
          $out = Join-Path $env:RUNNER_TEMP 'e2e'
          ./tests/e2e/run.ps1 -Report "$out/junit-jiyda-frame.xml" -ShotDir "$out/shots"; $own = $LASTEXITCODE
          ./tests/e2e/run.ps1 -NativeFrame -Port 8766 -Report "$out/junit-native-frame.xml" -ShotDir "$out/shots"; $native = $LASTEXITCODE
          if ($own -or $native) { exit 1 }
      - name: Отчёт E2E и снимки экрана
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore

      - name: Версия из метки совпадает с Cargo.toml, release notes написаны
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($cargo -ne $tag) { throw "Метка v$tag, а в Cargo.toml версия $cargo" }
          if (-not (Test-Path "docs/releases/${{ github.ref_name }}.md")) {
            throw "Нет release notes: docs/releases/${{ github.ref_name }}.md (на английском)"
          }

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Установщик
        shell: pwsh
        run: ./installer/build.ps1

      # Контрольная сумма рядом с установщиком: Jiyda сверяет её перед запуском обновления
      # (src/update.rs). Формат как у sha256sum: «<хэш>  <имя файла>».
      - name: SHA-256 установщика
        shell: pwsh
        run: |
          Get-ChildItem target/installer/JiydaSetup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  $($_.Name)" -NoNewline -Encoding ascii
            Write-Host "$hash  $($_.Name)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: jiyda-windows
          path: |
            target/release/jiyda.exe
            target/installer/JiydaSetup-*.exe
            target/installer/JiydaSetup-*.exe.sha256

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Jiyda ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          # Seyro 0.5.0 обновляется через отдельный репозиторий-мост chatyev/seyro (релиз 0.6.0
          # с SeyroSetup-0.6.0.exe): адреса этого репозитория он не принимает.
          # Без .sha256 Jiyda 0.6.2+ обновление не установит.
          files: |
            target/installer/JiydaSetup-*.exe
            target/installer/JiydaSetup-*.exe.sha256
