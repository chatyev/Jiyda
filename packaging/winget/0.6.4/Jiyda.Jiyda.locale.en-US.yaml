ShortDescription: A Windows browser written in Rust, with Spaces and Orbit instead of a tab strip.
Description: |-
  Jiyda is a free browser for Windows written in Rust and made in Uzbekistan. Instead of a row of tabs,
  pages live in Spaces, each with its own cookies and logins, and Orbit shows every open page grouped
  at a glance. New Page picks up where you left off, trackers and ads are blocked out of the box, and
  your history never leaves your computer. Pages are shown by Microsoft Edge WebView2.
